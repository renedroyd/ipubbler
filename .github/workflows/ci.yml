name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build web
        run: npm run build:web
      - name: Typecheck API
        run: npx tsc --noEmit -p apps/api/tsconfig.json
      - name: Test API
        run: npm test
